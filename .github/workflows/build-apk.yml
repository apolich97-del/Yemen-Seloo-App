name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: إعادة إنشاء android/
        run: |
          rm -rf android/
          flutter create . \
            --platforms=android \
            --org com.yemenseloo \
            --project-name yemen_seloo \
            --no-pub

      - name: نسخ google-services.json (احتياطي)
        run: |
          mkdir -p android/app
          cat > android/app/google-services.json <<'JSON_EOF'
          {
            "project_info": {
              "project_number": "580529134357",
              "project_id": "yemen-seloo-app",
              "storage_bucket": "yemen-seloo-app.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:580529134357:android:47521410ef2d77eba3671c",
                  "android_client_info": {
                    "package_name": "com.yemenseloo.yemen_seloo"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyA2aX5gDos7IBU3lkFM_i2nIpuAzMIsZgE"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON_EOF
          echo "✓ google-services.json جاهز"

      - name: ⭐ إنشاء values.xml يدويًا (تجاوز google-services plugin)
        run: |
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/values.xml <<'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="google_app_id" translatable="false">1:580529134357:android:47521410ef2d77eba3671c</string>
              <string name="gcm_defaultSenderId" translatable="false">580529134357</string>
              <string name="google_api_key" translatable="false">AIzaSyA2aX5gDos7IBU3lkFM_i2nIpuAzMIsZgE</string>
              <string name="project_id" translatable="false">yemen-seloo-app</string>
              <string name="google_storage_bucket" translatable="false">yemen-seloo-app.firebasestorage.app</string>
              <string name="firebase_database_url" translatable="false"></string>
              <string name="default_web_client_id" translatable="false"></string>
              <string name="ga_trackingId" translatable="false"></string>
          </resources>
          XML_EOF
          echo "=== محتوى values.xml ==="
          cat android/app/src/main/res/values/values.xml

      - name: تصحيح اسم التطبيق
        run: |
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="يمن سيلو"|' "$F"
          grep "android:label" "$F"

      - name: تعديل settings.gradle (Kotlin فقط — بدون google-services)
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path
          p = Path('android/settings.gradle')
          content = p.read_text()
          content = re.sub(
              r'id\s+"org\.jetbrains\.kotlin\.android"\s+version\s+"[^"]*"',
              'id "org.jetbrains.kotlin.android" version "1.9.24"',
              content
          )
          p.write_text(content)
          print(content)
          PYEOF

      - name: تعديل app/build.gradle (NDK + minSdk — بدون google-services plugin)
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path
          p = Path('android/app/build.gradle')
          lines = p.read_text().split('\n')
          out = []
          has_ndk = False

          for line in lines:
              s = line.strip()
              ind = line[:len(line) - len(line.lstrip())]

              if 'com.google.gms.google-services' in s:
                  continue
              if re.match(r'^minSdkVersion\b', s):
                  out.append(f'{ind}minSdkVersion 23')
                  continue
              if re.match(r'^minSdk\s*=', s):
                  out.append(f'{ind}minSdk = 23')
                  continue
              if re.match(r'^ndkVersion\b', s):
                  out.append(f'{ind}ndkVersion "25.1.8937393"')
                  has_ndk = True
                  continue

              out.append(line)

              if re.search(r'^android\s*\{', s) and not has_ndk:
                  out.append(f'{ind}    ndkVersion "25.1.8937393"')
                  has_ndk = True
                  continue

          p.write_text('\n'.join(out))
          print(p.read_text())
          PYEOF

      - name: التحقق النهائي
        run: |
          echo "=== values.xml ==="
          cat android/app/src/main/res/values/values.xml
          echo ""
          echo "=== minSdk + ndkVersion ==="
          grep -n "minSdk\|ndkVersion" android/app/build.gradle
          echo ""
          echo "=== google-services (يجب أن يكون فارغًا) ==="
          grep -n "google-services" android/settings.gradle android/app/build.gradle || echo "✓ لا يوجد (طبيعي)"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: التحقق من APK
        if: always()
        run: |
          echo "=== هل APK موجود؟ ==="
          ls -la build/app/outputs/flutter-apk/app-release.apk || echo "❌ APK مفقود"
          echo ""
          echo "=== هل values.xml داخل build؟ ==="
          find build -name "values.xml" 2>/dev/null | head -5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yemen-seloo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: warn
