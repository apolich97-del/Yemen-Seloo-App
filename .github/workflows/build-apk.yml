name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: إعادة إنشاء android/
        run: |
          rm -rf android/
          flutter create . \
            --platforms=android \
            --org com.yemenseloo \
            --project-name yemen_seloo \
            --no-pub

      - name: ⭐ فك تشفير Keystore
        run: |
          if [ ! -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
            echo "✓ Keystore تم فك تشفيره"
          else
            echo "⚠️ تحذير: لم يتم العثور على KEYSTORE_BASE64 في الأسرار"
          fi

      - name: ⭐ إنشاء ملف key.properties
        run: |
          if [ ! -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
            echo "✓ key.properties تم إنشاؤه"
          fi

      - name: نسخ google-services.json (احتياطي)
        run: |
          mkdir -p android/app
          cat > android/app/google-services.json <<'JSON_EOF'
          {
            "project_info": {
              "project_number": "580529134357",
              "project_id": "yemen-seloo-app",
              "storage_bucket": "yemen-seloo-app.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:580529134357:android:47521410ef2d77eba3671c",
                  "android_client_info": {
                    "package_name": "com.yemenseloo.yemen_seloo"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyA2aX5gDos7IBU3lkFM_i2nIpuAzMIsZgE"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON_EOF

      - name: ⭐ إنشاء values.xml يدويًا
        run: |
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/values.xml <<'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="google_app_id" translatable="false">1:580529134357:android:47521410ef2d77eba3671c</string>
              <string name="gcm_defaultSenderId" translatable="false">580529134357</string>
              <string name="google_api_key" translatable="false">AIzaSyA2aX5gDos7IBU3lkFM_i2nIpuAzMIsZgE</string>
              <string name="project_id" translatable="false">yemen-seloo-app</string>
              <string name="google_storage_bucket" translatable="false">yemen-seloo-app.firebasestorage.app</string>
              <string name="firebase_database_url" translatable="false"></string>
              <string name="default_web_client_id" translatable="false"></string>
              <string name="ga_trackingId" translatable="false"></string>
          </resources>
          XML_EOF

      - name: تصحيح اسم التطبيق
        run: |
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="يمن سيلو"|' "$F"

      - name: تعديل settings.gradle (Kotlin فقط)
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path
          p = Path('android/settings.gradle')
          content = p.read_text()
          content = re.sub(
              r'id\s+"org\.jetbrains\.kotlin\.android"\s+version\s+"[^"]*"',
              'id "org.jetbrains.kotlin.android" version "1.9.24"',
              content
          )
          p.write_text(content)
          PYEOF

      - name: ⭐ تعديل app/build.gradle (التوقيع + NDK + minSdk)
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path
          p = Path('android/app/build.gradle')
          content = p.read_text()

          # إضافة قراءة ملف key.properties قبل android {
          keystore_loading = """
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          android {
          """
          content = content.replace('android {', keystore_loading, 1)

          # إضافة signingConfigs داخل android {
          signing_configs = """
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
              buildTypes {
          """
          content = content.replace('buildTypes {', signing_configs, 1)

          # تطبيق التوقيع على إصدار الـ release
          content = content.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')

          # تحديث minSdk و NDK
          content = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 23', content)
          content = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 23', content)
          content = re.sub(r'minSdk\s+flutter\.minSdkVersion', 'minSdk = 23', content)
          content = re.sub(r'minSdk\s+\d+', 'minSdk = 23', content)
          content = re.sub(r'ndkVersion\s+flutter\.ndkVersion', 'ndkVersion "25.1.8937393"', content)
          content = re.sub(r'ndkVersion\s+"[^"]+"', 'ndkVersion "25.1.8937393"', content)

          p.write_text(content)
          print(content)
          PYEOF

      - name: ⭐ تحديث رقم الإصدار تلقائياً
        run: |
          # استبدال سطر الإصدار في pubspec.yaml بالرقم التسلسلي للبناء
          sed -i "s/^version: .*/version: 1.0.0+${{ github.run_number }}/" pubspec.yaml
          echo "=== الإصدار الجديد ==="
          grep "^version:" pubspec.yaml

      - name: Flutter pub get
        run: flutter pub get

      - name: ⭐ توليد أيقونة التطبيق
        run: dart run flutter_launcher_icons

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "يمن سيلو - إصدار ${{ github.run_number }}"
          body: |
            إصدار جديد من تطبيق يمن سيلو
            - Build #${{ github.run_number }}
            - Commit: ${{ github.sha }}
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
