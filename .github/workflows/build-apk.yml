name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: نسخ google-services.json احتياطيًا
        run: |
          if [ -f "android/app/google-services.json" ]; then
            mkdir -p /tmp/seloo-backup
            cp android/app/google-services.json /tmp/seloo-backup/google-services.json
          fi

      - name: إعادة إنشاء android/ من الصفر
        run: |
          rm -rf android/
          flutter create . \
            --platforms=android \
            --org com.yemenseloo \
            --project-name yemen_seloo \
            --no-pub

      - name: استعادة google-services.json
        run: |
          if [ -f "/tmp/seloo-backup/google-services.json" ]; then
            cp /tmp/seloo-backup/google-services.json android/app/google-services.json
          fi

      - name: ترقية Kotlin و AGP و Gradle
        run: |
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's|id("com.android.application") version "[^"]*"|id("com.android.application") version "8.3.0"|g' android/settings.gradle.kts || true
            sed -i 's|id("org.jetbrains.kotlin.android") version "[^"]*"|id("org.jetbrains.kotlin.android") version "2.0.21"|g' android/settings.gradle.kts || true
            if ! grep -q 'com.google.gms.google-services' android/settings.gradle.kts; then
              sed -i '/id("com.android.application") version/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts || true
            fi
          fi

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|distributionUrl=.*gradle-[0-9.]*-all.zip|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties || true
          fi

      - name: ضبط build.gradle بـ Python سطرًا بسطر
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path

          def process(path):
              p = Path(path)
              if not p.exists():
                  print(f"⚠ {path} غير موجود")
                  return
              print(f"\n=== معالجة {path} ===")
              lines = p.read_text().split('\n')
              out = []
              has_ndk = False
              has_gs = False
              for i, line in enumerate(lines):
                  stripped = line.strip()
                  indent = line[:len(line) - len(line.lstrip())]

                  if stripped.startswith('ndkVersion'):
                      out.append(f'{indent}ndkVersion = "25.1.8937393"')
                      has_ndk = True
                      print(f"  [ndk] {line}  →  {indent}ndkVersion = ...")
                      continue

                  if re.match(r'^minSdkVersion\b', stripped):
                      out.append(f'{indent}minSdkVersion 23')
                      print(f"  [min] {line}  →  {indent}minSdkVersion 23")
                      continue

                  if re.match(r'^minSdk\s*=', stripped):
                      out.append(f'{indent}minSdk = 23')
                      print(f"  [min] {line}  →  {indent}minSdk = 23")
                      continue

                  if 'com.google.gms.google-services' in stripped:
                      has_gs = True

                  out.append(line)

                  if re.search(r'android\s*\{', stripped) and not has_ndk:
                      out.append(f'{indent}    ndkVersion = "25.1.8937393"')
                      has_ndk = True
                      print(f"  [+ndk] أُضيف بعد android {{")
                      continue

                  if re.match(r'^id\s*\(?["\']com\.android\.application["\']\)?', stripped) and not has_gs:
                      out.append(f'{indent}    id("com.google.gms.google-services")')
                      has_gs = True
                      print(f"  [+gs] أُضيف بعد id(com.android.application)")

              p.write_text('\n'.join(out))
              print(f"=== {path} — انتهى ===")

          process('android/app/build.gradle.kts')
          process('android/app/build.gradle')

          print("\n===== محتوى build.gradle النهائي =====")
          import os
          for f in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              if os.path.exists(f):
                  print(f"\n--- {f} ---")
                  print(Path(f).read_text())
          PYEOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yemen-seloo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: warn
