name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: نسخ google-services.json احتياطيًا
        run: |
          if [ -f "android/app/google-services.json" ]; then
            mkdir -p /tmp/seloo-backup
            cp android/app/google-services.json /tmp/seloo-backup/google-services.json
            echo "✓ احتياطي google-services.json"
          fi

      - name: إعادة إنشاء android/ من الصفر
        run: |
          rm -rf android/
          flutter create . \
            --platforms=android \
            --org com.yemenseloo \
            --project-name yemen_seloo \
            --no-pub
          echo "=== محتوى android/app ==="
          ls -la android/app/

      - name: استعادة google-services.json
        run: |
          if [ -f "/tmp/seloo-backup/google-services.json" ]; then
            cp /tmp/seloo-backup/google-services.json android/app/google-services.json
          fi

      - name: ترقية Kotlin و AGP و Gradle
        run: |
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's|id("com.android.application") version "[^"]*"|id("com.android.application") version "8.3.0"|g' android/settings.gradle.kts || true
            sed -i 's|id("org.jetbrains.kotlin.android") version "[^"]*"|id("org.jetbrains.kotlin.android") version "2.0.21"|g' android/settings.gradle.kts || true
            if ! grep -q 'com.google.gms.google-services' android/settings.gradle.kts; then
              sed -i '/id("com.android.application") version/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts || true
            fi
          fi

          if [ -f android/settings.gradle ]; then
            sed -i 's|id "com.android.application" version "[^"]*"|id "com.android.application" version "8.3.0"|g' android/settings.gradle || true
            sed -i 's|id "org.jetbrains.kotlin.android" version "[^"]*"|id "org.jetbrains.kotlin.android" version "2.0.21"|g' android/settings.gradle || true
          fi

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|distributionUrl=.*gradle-[0-9.]*-all.zip|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties || true
          fi

      - name: ضبط minSdk و ndkVersion بـ Python (دقيق)
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path

          files = ['android/app/build.gradle.kts', 'android/app/build.gradle']
          for f in files:
              p = Path(f)
              if not p.exists():
                  continue
              content = p.read_text()
              print(f"\n=== {f} (قبل) ===")
              for line in content.split('\n'):
                  if 'minSdk' in line or 'ndkVersion' in line or 'google-services' in line:
                      print(f"  > {line}")

              # minSdk — كل الصيغ الممكنة
              content = re.sub(r'minSdkVersion\s+\S+', 'minSdkVersion 23', content)
              content = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 23', content)
              content = re.sub(r'minSdk\s*=\s*\d+', 'minSdk = 23', content)
              content = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 23', content)

              # ndkVersion
              if 'ndkVersion' in content:
                  content = re.sub(r'ndkVersion\s*=?\s*"[^"]*"', 'ndkVersion = "25.1.8937393"', content)
              else:
                  # إضافة ndkVersion بعد "android {"
                  content = re.sub(r'(android\s*\{)', r'\1\n    ndkVersion = "25.1.8937393"', content, count=1)

              # google-services plugin
              if 'com.google.gms.google-services' not in content:
                  content = re.sub(r'(id\("com\.android\.application"\))', r'\1\n    id("com.google.gms.google-services")', content, count=1)
                  content = re.sub(r'(id "com\.android\.application")', r'\1\n    id "com.google.gms.google-services"', content, count=1)

              p.write_text(content)
              print(f"=== {f} (بعد) ===")
              for line in content.split('\n'):
                  if 'minSdk' in line or 'ndkVersion' in line or 'google-services' in line:
                      print(f"  > {line}")
          PYEOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yemen-seloo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: warn
