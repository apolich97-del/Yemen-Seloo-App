name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: نسخ google-services.json احتياطيًا
        run: |
          if [ -f "android/app/google-services.json" ]; then
            mkdir -p /tmp/seloo-backup
            cp android/app/google-services.json /tmp/seloo-backup/google-services.json
          fi

      - name: إعادة إنشاء android/ من الصفر
        run: |
          rm -rf android/
          flutter create . \
            --platforms=android \
            --org com.yemenseloo \
            --project-name yemen_seloo \
            --no-pub

      - name: استعادة google-services.json
        run: |
          if [ -f "/tmp/seloo-backup/google-services.json" ]; then
            cp /tmp/seloo-backup/google-services.json android/app/google-services.json
          fi

      - name: فرض Gradle 8.4 (استبدال الملف بالكامل)
        run: |
          cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-all.zip
          EOF
          echo "=== gradle-wrapper.properties ==="
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: تعديل settings.gradle (Groovy)
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path

          p = Path('android/settings.gradle')
          if not p.exists():
              print("⚠ settings.gradle غير موجود")
              exit(0)

          content = p.read_text()
          print("=== settings.gradle (قبل) ===")
          print(content)

          content = re.sub(
              r'id\s+"org\.jetbrains\.kotlin\.android"\s+version\s+"[^"]*"',
              'id "org.jetbrains.kotlin.android" version "1.9.24"',
              content
          )
          content = re.sub(
              r'id\s+"com\.android\.application"\s+version\s+"[^"]*"',
              'id "com.android.application" version "8.1.4"',
              content
          )

          if 'com.google.gms.google-services' not in content:
              content = re.sub(
                  r'(id\s+"com\.android\.application"\s+version\s+"[^"]*")',
                  r'\1\n    id "com.google.gms.google-services" version "4.4.2" apply false',
                  content
              )

          p.write_text(content)
          print("=== settings.gradle (بعد) ===")
          print(content)
          PYEOF

      - name: تعديل settings.gradle.kts (Kotlin DSL)
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path

          p = Path('android/settings.gradle.kts')
          if not p.exists():
              print("⚠ settings.gradle.kts غير موجود")
              exit(0)

          content = p.read_text()
          print("=== settings.gradle.kts (قبل) ===")
          print(content)

          content = re.sub(
              r'id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"[^"]*"',
              'id("org.jetbrains.kotlin.android") version "1.9.24"',
              content
          )
          content = re.sub(
              r'id\("com\.android\.application"\)\s+version\s+"[^"]*"',
              'id("com.android.application") version "8.1.4"',
              content
          )

          if 'com.google.gms.google-services' not in content:
              content = re.sub(
                  r'(id\("com\.android\.application"\)\s+version\s+"[^"]*")',
                  r'\1\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                  content
              )

          p.write_text(content)
          print("=== settings.gradle.kts (بعد) ===")
          print(content)
          PYEOF

      - name: ضبط build.gradle (app)
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path

          for path in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              p = Path(path)
              if not p.exists():
                  continue
              print(f"\n=== {path} ===")
              lines = p.read_text().split('\n')
              out = []
              has_ndk = False
              has_gs = False
              for line in lines:
                  s = line.strip()
                  ind = line[:len(line) - len(line.lstrip())]

                  if s.startswith('ndkVersion'):
                      out.append(f'{ind}ndkVersion = "25.1.8937393"')
                      has_ndk = True
                      continue
                  if re.match(r'^minSdkVersion\b', s):
                      out.append(f'{ind}minSdkVersion 23')
                      continue
                  if re.match(r'^minSdk\s*=', s):
                      out.append(f'{ind}minSdk = 23')
                      continue

                  if 'com.google.gms.google-services' in s:
                      has_gs = True

                  out.append(line)

                  if re.search(r'^android\s*\{', s) and not has_ndk:
                      out.append(f'{ind}    ndkVersion = "25.1.8937393"')
                      has_ndk = True
                      continue
                  if re.match(r'^id\s*\(?["\']com\.android\.application["\']\)?', s) and not has_gs:
                      out.append(f'{ind}    id("com.google.gms.google-services")')
                      has_gs = True

              p.write_text('\n'.join(out))
              print(p.read_text())
          PYEOF

      - name: التحقق النهائي من الملفات
        run: |
          echo "=== settings.gradle ==="
          cat android/settings.gradle || true
          echo ""
          echo "=== gradle-wrapper.properties ==="
          cat android/gradle/wrapper/gradle-wrapper.properties || true
          echo ""
          echo "=== build.gradle (app) — أسطر مهمة ==="
          grep -n "minSdk\|ndk\|google-services" android/app/build.gradle || true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yemen-seloo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: warn
