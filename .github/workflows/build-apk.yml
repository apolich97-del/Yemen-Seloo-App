name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: نسخ google-services.json احتياطيًا
        run: |
          if [ -f "android/app/google-services.json" ]; then
            mkdir -p /tmp/seloo-backup
            cp android/app/google-services.json /tmp/seloo-backup/google-services.json
          fi

      - name: إعادة إنشاء android/ بإعدادات Flutter الافتراضية
        run: |
          rm -rf android/
          flutter create . \
            --platforms=android \
            --org com.yemenseloo \
            --project-name yemen_seloo \
            --no-pub

      - name: استعادة google-services.json
        run: |
          if [ -f "/tmp/seloo-backup/google-services.json" ]; then
            cp /tmp/seloo-backup/google-services.json android/app/google-services.json
          fi

      - name: عرض الإعدادات الافتراضية
        run: |
          echo "=== settings.gradle ==="
          cat android/settings.gradle || true
          echo ""
          echo "=== app/build.gradle ==="
          cat android/app/build.gradle || true
          echo ""
          echo "=== gradle-wrapper.properties ==="
          cat android/gradle/wrapper/gradle-wrapper.properties || true

      - name: إضافة google-services + minSdk 23 + NDK (بدون تغيير الإصدارات)
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path

          # ============ settings.gradle ============
          p = Path('android/settings.gradle')
          if p.exists():
              content = p.read_text()
              if 'com.google.gms.google-services' not in content:
                  # أضف بعد kotlin.android في plugins block
                  content = re.sub(
                      r'(id\s+"org\.jetbrains\.kotlin\.android"\s+version\s+"[^"]*"\s+apply\s+false)',
                      r'\1\n    id "com.google.gms.google-services" version "4.4.2" apply false',
                      content,
                      count=1
                  )
              p.write_text(content)
              print("=== settings.gradle (بعد) ===")
              print(content)

          # ============ app/build.gradle ============
          p = Path('android/app/build.gradle')
          if p.exists():
              lines = p.read_text().split('\n')
              out = []
              has_gs = False
              has_ndk = False
              in_android_block = False

              for line in lines:
                  s = line.strip()
                  ind = line[:len(line) - len(line.lstrip())]

                  # minSdkVersion
                  if re.match(r'^minSdkVersion\b', s):
                      out.append(f'{ind}minSdkVersion 23')
                      continue
                  # minSdk = ...
                  if re.match(r'^minSdk\s*=', s):
                      out.append(f'{ind}minSdk = 23')
                      continue
                  # ndkVersion
                  if re.match(r'^ndkVersion\b', s):
                      out.append(f'{ind}ndkVersion "25.1.8937393"')
                      has_ndk = True
                      continue
                  # تتبع google-services
                  if 'com.google.gms.google-services' in s:
                      has_gs = True

                  out.append(line)

                  # أضف ndkVersion بعد فتح android {
                  if re.search(r'^android\s*\{', s) and not has_ndk:
                      out.append(f'{ind}    ndkVersion "25.1.8937393"')
                      has_ndk = True
                      continue

              content = '\n'.join(out)

              # أضف google-services plugin بعد kotlin-android
              if not has_gs:
                  content = re.sub(
                      r'(id\s+"kotlin-android")',
                      r'\1\n    id "com.google.gms.google-services"',
                      content,
                      count=1
                  )

              p.write_text(content)
              print("\n=== app/build.gradle (بعد) ===")
              print(content)
          PYEOF

      - name: التحقق النهائي
        run: |
          echo "=== أسطر google-services ==="
          grep -n "google-services" android/settings.gradle android/app/build.gradle || true
          echo ""
          echo "=== أسطر minSdk و ndkVersion ==="
          grep -n "minSdk\|ndkVersion" android/app/build.gradle || true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yemen-seloo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: warn
