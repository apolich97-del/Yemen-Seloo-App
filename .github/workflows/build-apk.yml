name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: نسخ google-services.json احتياطيًا
        run: |
          if [ -f "android/app/google-services.json" ]; then
            mkdir -p /tmp/seloo-backup
            cp android/app/google-services.json /tmp/seloo-backup/google-services.json
            echo "✓ احتياطي google-services.json"
          fi

      - name: إعادة إنشاء android/ من الصفر
        run: |
          # حذف كل شيء
          rm -rf android/

          # إنشاء نظيف
          flutter create . \
            --platforms=android \
            --org com.yemenseloo \
            --project-name yemen_seloo \
            --no-pub

          echo "=== محتوى android/ ==="
          ls -la android/app/src/main/kotlin/com/yemenseloo/yemen_seloo/ || true
          echo "=== AndroidManifest.xml ==="
          cat android/app/src/main/AndroidManifest.xml || true

      - name: استعادة google-services.json
        run: |
          if [ -f "/tmp/seloo-backup/google-services.json" ]; then
            cp /tmp/seloo-backup/google-services.json android/app/google-services.json
            echo "✓ استرجاع google-services.json"
          fi

      - name: ترقية Kotlin و AGP و Gradle
        run: |
          # settings.gradle.kts
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's|id("com.android.application") version "[^"]*"|id("com.android.application") version "8.3.0"|g' android/settings.gradle.kts || true
            sed -i 's|id("org.jetbrains.kotlin.android") version "[^"]*"|id("org.jetbrains.kotlin.android") version "2.0.21"|g' android/settings.gradle.kts || true
            if ! grep -q 'com.google.gms.google-services' android/settings.gradle.kts; then
              sed -i '/id("com.android.application") version/a\    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts || true
            fi
          fi

          # settings.gradle
          if [ -f android/settings.gradle ]; then
            sed -i 's|id "com.android.application" version "[^"]*"|id "com.android.application" version "8.3.0"|g' android/settings.gradle || true
            sed -i 's|id "org.jetbrains.kotlin.android" version "[^"]*"|id "org.jetbrains.kotlin.android" version "2.0.21"|g' android/settings.gradle || true
            if ! grep -q 'com.google.gms.google-services' android/settings.gradle; then
              sed -i '/id "com.android.application" version/a\        id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle || true
            fi
          fi

          # Gradle wrapper
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's|distributionUrl=.*gradle-[0-9.]*-all.zip|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties || true
            sed -i 's|distributionUrl=.*gradle-[0-9.]*-bin.zip|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties || true
          fi

      - name: ضبط build.gradle.kts / build.gradle
        run: |
          # app/build.gradle.kts
          if [ -f android/app/build.gradle.kts ]; then
            if ! grep -q 'com.google.gms.google-services' android/app/build.gradle.kts; then
              sed -i '/id("com.android.application")/a\    id("com.google.gms.google-services")' android/app/build.gradle.kts || true
            fi
            sed -i 's|minSdk = flutter.minSdkVersion|minSdk = 23|g' android/app/build.gradle.kts || true
            sed -i 's|minSdk = [0-9]\+|minSdk = 23|g' android/app/build.gradle.kts || true
            if grep -q 'ndkVersion' android/app/build.gradle.kts; then
              sed -i 's|ndkVersion = .*|ndkVersion = "25.1.8937393"|' android/app/build.gradle.kts || true
            else
              sed -i '/android {/a\    ndkVersion = "25.1.8937393"' android/app/build.gradle.kts || true
            fi
            echo "=== build.gradle.kts النهائي ==="
            cat android/app/build.gradle.kts
          fi

          # app/build.gradle
          if [ -f android/app/build.gradle ]; then
            if ! grep -q 'com.google.gms.google-services' android/app/build.gradle; then
              sed -i '/id "com.android.application"/a\    id "com.google.gms.google-services"' android/app/build.gradle || true
            fi
            sed -i 's|minSdkVersion flutter.minSdkVersion|minSdkVersion 23|g' android/app/build.gradle || true
            sed -i 's|minSdkVersion [0-9]\+|minSdkVersion 23|g' android/app/build.gradle || true
            if grep -q 'ndkVersion' android/app/build.gradle; then
              sed -i 's|ndkVersion .*|ndkVersion = "25.1.8937393"|' android/app/build.gradle || true
            else
              sed -i '/android {/a\    ndkVersion = "25.1.8937393"' android/app/build.gradle || true
            fi
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yemen-seloo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: warn
