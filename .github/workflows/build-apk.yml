name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: كتابة google-services.json
        run: |
          mkdir -p /tmp/seloo-backup
          cat > /tmp/seloo-backup/google-services.json <<'JSON_EOF'
          {
            "project_info": {
              "project_number": "580529134357",
              "project_id": "yemen-seloo-app",
              "storage_bucket": "yemen-seloo-app.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:580529134357:android:47521410ef2d77eba3671c",
                  "android_client_info": {
                    "package_name": "com.yemenseloo.yemen_seloo"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyA2aX5gDos7IBU3lkFM_i2nIpuAzMIsZgE"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON_EOF
          echo "✓ google-services.json جاهز"

      - name: إعادة إنشاء android/
        run: |
          rm -rf android/
          flutter create . \
            --platforms=android \
            --org com.yemenseloo \
            --project-name yemen_seloo \
            --no-pub

      - name: نسخ google-services.json
        run: |
          mkdir -p android/app
          cp /tmp/seloo-backup/google-services.json android/app/google-services.json
          ls -la android/app/google-services.json
          cat android/app/google-services.json

      - name: تصحيح اسم التطبيق
        run: |
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="يمن سيلو"|' "$F"
          grep "android:label" "$F"

      - name: تعديل settings.gradle (Kotlin فقط)
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path
          p = Path('android/settings.gradle')
          content = p.read_text()
          # رفع Kotlin
          content = re.sub(
              r'id\s+"org\.jetbrains\.kotlin\.android"\s+version\s+"[^"]*"',
              'id "org.jetbrains.kotlin.android" version "1.9.24"',
              content
          )
          # إزالة google-services إن كانت موجودة
          content = re.sub(
              r'\s*id\s+"com\.google\.gms\.google-services"\s+version\s+"[^"]*"\s+apply\s+false',
              '',
              content
          )
          p.write_text(content)
          print("=== settings.gradle النهائي ===")
          print(content)
          PYEOF

      - name: تعديل app/build.gradle (NDK + minSdk + google-services)
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path
          p = Path('android/app/build.gradle')
          content = p.read_text()
          lines = content.split('\n')
          out = []
          has_ndk = False

          for line in lines:
              s = line.strip()
              ind = line[:len(line) - len(line.lstrip())]

              # إزالة google-services من plugins block
              if 'com.google.gms.google-services' in s:
                  continue

              # minSdk
              if re.match(r'^minSdkVersion\b', s):
                  out.append(f'{ind}minSdkVersion 23')
                  continue
              if re.match(r'^minSdk\s*=', s):
                  out.append(f'{ind}minSdk = 23')
                  continue

              # ndkVersion
              if re.match(r'^ndkVersion\b', s):
                  out.append(f'{ind}ndkVersion "25.1.8937393"')
                  has_ndk = True
                  continue

              out.append(line)

              if re.search(r'^android\s*\{', s) and not has_ndk:
                  out.append(f'{ind}    ndkVersion "25.1.8937393"')
                  has_ndk = True
                  continue

          content = '\n'.join(out)

          # ⭐ الحل: أضف apply plugin في آخر الملف
          content = content.rstrip() + '\n\n// Firebase Google Services (الطريقة الكلاسيكية)\napply plugin: "com.google.gms.google-services"\n'

          p.write_text(content)
          print("=== app/build.gradle النهائي ===")
          print(content)
          PYEOF

      - name: التحقق النهائي
        run: |
          echo "=== google-services.json ==="
          ls -la android/app/google-services.json
          echo ""
          echo "=== google-services في build.gradle ==="
          grep -n "google-services" android/app/build.gradle
          echo ""
          echo "=== minSdk + ndkVersion ==="
          grep -n "minSdk\|ndkVersion" android/app/build.gradle
          echo ""
          echo "=== محتوى plugins block ==="
          sed -n '/^plugins {/,/^}/p' android/app/build.gradle

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: التحقق من توليد values.xml
        if: always()
        run: |
          echo "=== البحث عن values.xml ==="
          find android/app/build -name "values.xml" 2>/dev/null | head -20
          echo ""
          echo "=== محتوى مجلد google-services ==="
          find android/app/build -type d -name "*google-services*" 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yemen-seloo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: warn
