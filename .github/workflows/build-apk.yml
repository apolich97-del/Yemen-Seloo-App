name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: نسخ google-services.json احتياطيًا
        run: |
          if [ -f "android/app/google-services.json" ]; then
            mkdir -p /tmp/seloo-backup
            cp android/app/google-services.json /tmp/seloo-backup/google-services.json
          fi

      - name: إعادة إنشاء android/
        run: |
          rm -rf android/
          flutter create . \
            --platforms=android \
            --org com.yemenseloo \
            --project-name yemen_seloo \
            --no-pub

      - name: استعادة google-services.json
        run: |
          if [ -f "/tmp/seloo-backup/google-services.json" ]; then
            cp /tmp/seloo-backup/google-services.json android/app/google-services.json
          fi

      - name: تعديل settings.gradle
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path

          p = Path('android/settings.gradle')
          content = p.read_text()
          print("=== قبل ===")
          print(content)

          # رفع Kotlin إلى 1.9.24
          content = re.sub(
              r'id\s+"org\.jetbrains\.kotlin\.android"\s+version\s+"[^"]*"',
              'id "org.jetbrains.kotlin.android" version "1.9.24"',
              content
          )

          # إضافة google-services
          if 'com.google.gms.google-services' not in content:
              content = re.sub(
                  r'(id\s+"org\.jetbrains\.kotlin\.android"\s+version\s+"[^"]*"\s+apply\s+false)',
                  r'\1\n    id "com.google.gms.google-services" version "4.4.2" apply false',
                  content,
                  count=1
              )

          p.write_text(content)
          print("=== بعد ===")
          print(content)
          PYEOF

      - name: تعديل app/build.gradle
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path

          p = Path('android/app/build.gradle')
          lines = p.read_text().split('\n')
          out = []
          has_gs = False
          has_ndk = False

          for line in lines:
              s = line.strip()
              ind = line[:len(line) - len(line.lstrip())]

              if re.match(r'^minSdkVersion\b', s):
                  out.append(f'{ind}minSdkVersion 23')
                  continue
              if re.match(r'^minSdk\s*=', s):
                  out.append(f'{ind}minSdk = 23')
                  continue
              if re.match(r'^ndkVersion\b', s):
                  out.append(f'{ind}ndkVersion "25.1.8937393"')
                  has_ndk = True
                  continue
              if 'com.google.gms.google-services' in s:
                  has_gs = True

              out.append(line)

              if re.search(r'^android\s*\{', s) and not has_ndk:
                  out.append(f'{ind}    ndkVersion "25.1.8937393"')
                  has_ndk = True
                  continue

          content = '\n'.join(out)

          if not has_gs:
              content = re.sub(
                  r'(id\s+"kotlin-android")',
                  r'\1\n    id "com.google.gms.google-services"',
                  content,
                  count=1
              )

          p.write_text(content)
          print("=== build.gradle بعد ===")
          print(content)
          PYEOF

      - name: التحقق
        run: |
          echo "=== settings.gradle ==="
          cat android/settings.gradle
          echo ""
          echo "=== minSdk/ndk/google-services ==="
          grep -n "minSdk\|ndkVersion\|google-services" android/app/build.gradle

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yemen-seloo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: warn
