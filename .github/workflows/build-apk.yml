name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: كتابة google-services.json
        run: |
          mkdir -p /tmp/seloo-backup
          cat > /tmp/seloo-backup/google-services.json <<'JSON_EOF'
          {
            "project_info": {
              "project_number": "580529134357",
              "project_id": "yemen-seloo-app",
              "storage_bucket": "yemen-seloo-app.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:580529134357:android:47521410ef2d77eba3671c",
                  "android_client_info": {
                    "package_name": "com.yemenseloo.yemen_seloo"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyA2aX5gDos7IBU3lkFM_i2nIpuAzMIsZgE"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON_EOF
          echo "✓ google-services.json مكتوب"
          cat /tmp/seloo-backup/google-services.json

      - name: إعادة إنشاء android/
        run: |
          rm -rf android/
          flutter create . \
            --platforms=android \
            --org com.yemenseloo \
            --project-name yemen_seloo \
            --no-pub

      - name: نسخ google-services.json إلى android/app/
        run: |
          mkdir -p android/app
          cp /tmp/seloo-backup/google-services.json android/app/google-services.json
          echo "=== التحقق ==="
          ls -la android/app/google-services.json

      - name: تصحيح اسم التطبيق في AndroidManifest
        run: |
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="يمن سيلو"|' "$F"
          echo "=== السطر المعدّل ==="
          grep -n "android:label" "$F"

      - name: تعديل settings.gradle (Kotlin + google-services)
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path

          p = Path('android/settings.gradle')
          content = p.read_text()
          print("=== settings.gradle قبل ===")
          print(content)

          content = re.sub(
              r'id\s+"org\.jetbrains\.kotlin\.android"\s+version\s+"[^"]*"',
              'id "org.jetbrains.kotlin.android" version "1.9.24"',
              content
          )

          if 'com.google.gms.google-services' not in content:
              content = re.sub(
                  r'(id\s+"org\.jetbrains\.kotlin\.android"\s+version\s+"[^"]*"\s+apply\s+false)',
                  r'\1\n    id "com.google.gms.google-services" version "4.4.2" apply false',
                  content,
                  count=1
              )

          p.write_text(content)
          print("=== settings.gradle بعد ===")
          print(content)
          PYEOF

      - name: تعديل app/build.gradle (minSdk + NDK + google-services)
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path

          p = Path('android/app/build.gradle')
          lines = p.read_text().split('\n')
          out = []
          has_gs = False
          has_ndk = False

          for line in lines:
              s = line.strip()
              ind = line[:len(line) - len(line.lstrip())]

              if re.match(r'^minSdkVersion\b', s):
                  out.append(f'{ind}minSdkVersion 23')
                  continue
              if re.match(r'^minSdk\s*=', s):
                  out.append(f'{ind}minSdk = 23')
                  continue
              if re.match(r'^ndkVersion\b', s):
                  out.append(f'{ind}ndkVersion "25.1.8937393"')
                  has_ndk = True
                  continue
              if 'com.google.gms.google-services' in s:
                  has_gs = True

              out.append(line)

              if re.search(r'^android\s*\{', s) and not has_ndk:
                  out.append(f'{ind}    ndkVersion "25.1.8937393"')
                  has_ndk = True
                  continue

          content = '\n'.join(out)

          if not has_gs:
              content = re.sub(
                  r'(id\s+"kotlin-android")',
                  r'\1\n    id "com.google.gms.google-services"',
                  content,
                  count=1
              )

          p.write_text(content)
          print("=== app/build.gradle بعد ===")
          print(content)
          PYEOF

      - name: التحقق النهائي
        run: |
          echo "=== google-services.json ==="
          ls -la android/app/google-services.json
          echo ""
          echo "=== اسم التطبيق ==="
          grep "android:label" android/app/src/main/AndroidManifest.xml
          echo ""
          echo "=== settings.gradle ==="
          cat android/settings.gradle
          echo ""
          echo "=== أسطر مهمة في app/build.gradle ==="
          grep -n "minSdk\|ndkVersion\|google-services" android/app/build.gradle

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yemen-seloo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: warn
