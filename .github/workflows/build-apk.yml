
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: إعادة إنشاء android/
        run: |
          rm -rf android/
          flutter create . \
            --platforms=android \
            --org com.yemenseloo \
            --project-name yemen_seloo \
            --no-pub

      - name: نسخ google-services.json (احتياطي)
        run: |
          mkdir -p android/app
          cat > android/app/google-services.json <<'JSON_EOF'
          {
            "project_info": {
              "project_number": "580529134357",
              "project_id": "yemen-seloo-app",
              "storage_bucket": "yemen-seloo-app.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:580529134357:android:47521410ef2d77eba3671c",
                  "android_client_info": {
                    "package_name": "com.yemenseloo.yemen_seloo"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyA2aX5gDos7IBU3lkFM_i2nIpuAzMIsZgE"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON_EOF
          echo "✓ google-services.json جاهز"

      - name: ⭐ إنشاء values.xml يدويًا
        run: |
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/values.xml <<'XML_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="google_app_id" translatable="false">1:580529134357:android:47521410ef2d77eba3671c</string>
              <string name="gcm_defaultSenderId" translatable="false">580529134357</string>
              <string name="google_api_key" translatable="false">AIzaSyA2aX5gDos7IBU3lkFM_i2nIpuAzMIsZgE</string>
              <string name="project_id" translatable="false">yemen-seloo-app</string>
              <string name="google_storage_bucket" translatable="false">yemen-seloo-app.firebasestorage.app</string>
              <string name="firebase_database_url" translatable="false"></string>
              <string name="default_web_client_id" translatable="false"></string>
              <string name="ga_trackingId" translatable="false"></string>
          </resources>
          XML_EOF
          echo "=== محتوى values.xml ==="
          cat android/app/src/main/res/values/values.xml

      - name: تصحيح اسم التطبيق
        run: |
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="يمن سيلو"|' "$F"
          grep "android:label" "$F"

      - name: استقبال روابط المشاركة من شي إن (intent-filter)
        run: |
          python3 << 'PYEOF'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.intent.action.SEND' in s:
              print('موجود مسبقا')
          else:
              filt = '''        <intent-filter>
                      <action android:name="android.intent.action.SEND" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <data android:mimeType="text/plain" />
                  </intent-filter>
          '''
              s = s.replace('</activity>', filt + '    </activity>', 1)
              p.write_text(s)
              print('تمت إضافة intent-filter للمشاركة')
          print('SEND' in p.read_text())
          PYEOF

      - name: تعديل settings.gradle (Kotlin فقط)
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path
          p = Path('android/settings.gradle')
          content = p.read_text()
          content = re.sub(
              r'id\s+"org\.jetbrains\.kotlin\.android"\s+version\s+"[^"]*"',
              'id "org.jetbrains.kotlin.android" version "1.9.24"',
              content
          )
          p.write_text(content)
          print(content)
          PYEOF

      - name: تعديل app/build.gradle (NDK + minSdk)
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path
          p = Path('android/app/build.gradle')
          lines = p.read_text().split('\n')
          out = []
          has_ndk = False
          for line in lines:
              s = line.strip()
              ind = line[:len(line) - len(line.lstrip())]
              if 'com.google.gms.google-services' in s:
                  continue
              if re.match(r'^minSdkVersion\b', s):
                  out.append(f'{ind}minSdkVersion 23')
                  continue
              if re.match(r'^minSdk\s*=', s):
                  out.append(f'{ind}minSdk = 23')
                  continue
              if re.match(r'^ndkVersion\b', s):
                  out.append(f'{ind}ndkVersion "25.1.8937393"')
                  has_ndk = True
                  continue
              out.append(line)
              if re.search(r'^android\s*\{', s) and not has_ndk:
                  out.append(f'{ind}    ndkVersion "25.1.8937393"')
                  has_ndk = True
                  continue
          p.write_text('\n'.join(out))
          print(p.read_text())
          PYEOF

      - name: ⭐ توقيع التطبيق بمفتاح ثابت (تحديثات تُثبَّت فوق القديم)
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.p12
            ls -la android/app/release-keystore.p12
            cat > android/key.properties <<'EOF'
          storePassword=Seloo@2026!Key
          keyPassword=Seloo@2026!Key
          keyAlias=yemen-seloo
          storeFile=release-keystore.p12
          EOF
            echo "✓ مخزن التوقيع الثابت جاهز"
          else
            echo "⚠️ السر KEYSTORE_BASE64 غير موجود — سيستمر التوقيع العشوائي (لن تُثبَّت التحديثات فوق القديم)"
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: ⭐ ربط إعدادات Gradle بمفتاح التوقيع
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path
          p = Path('android/app/build.gradle')
          content = p.read_text()

          if 'keystoreProperties' in content:
              print('التوقيع مربوط مسبقاً')
          else:
              loader = '''
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          '''
              signing = '''
              signingConfigs {
                  release {
                      if (keystorePropertiesFile.exists()) {
                          keyAlias keystoreProperties['keyAlias']
                          keyPassword keystoreProperties['keyPassword']
                          storeFile file(keystoreProperties['storeFile'])
                          storePassword keystoreProperties['storePassword']
                      }
                  }
              }
          '''
              content = content.replace('android {', loader + '\nandroid {', 1)
              content = re.sub(r'(android\s*\{)', r'\1\n' + signing, content, count=1)
              content = re.sub(
                  r'signingConfig\s*=?\s*signingConfigs\.debug',
                  'signingConfig signingConfigs.release',
                  content
              )
              p.write_text(content)
              print('✓ تم ربط توقيع release بالمفتاح الثابت')
          print(p.read_text())
          PYEOF

      - name: التحقق النهائي
        run: |
          echo "=== values.xml ==="
          cat android/app/src/main/res/values/values.xml
          echo ""
          echo "=== minSdk + ndkVersion ==="
          grep -n "minSdk\|ndkVersion" android/app/build.gradle
          echo ""
          echo "=== التوقيع ==="
          if [ -f android/key.properties ]; then
            echo "✓ key.properties موجود"
            grep -n "signingConfigs\|signingConfig " android/app/build.gradle | head -5
          else
            echo "⚠️ لا يوجد key.properties — بناء غير موقّع بمفتاح ثابت"
          fi

      - name: ⭐ تحديث رقم الإصدار تلقائياً (versionCode = رقم البناء)
        run: |
          sed -i "s/^version: .*/version: 1.0.0+${{ github.run_number }}/" pubspec.yaml
          echo "=== الإصدار الجديد ==="
          grep "^version:" pubspec.yaml

      - name: Flutter pub get
        run: flutter pub get

      - name: ⭐ توليد أيقونة التطبيق
        run: dart run flutter_launcher_icons

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "يمن سيلو - إصدار ${{ github.run_number }}"
          body: |
            إصدار جديد من تطبيق يمن سيلو
            - Build #${{ github.run_number }}
            - Commit: ${{ github.sha }}
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
