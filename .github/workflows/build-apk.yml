name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: توليد مجلد android/ إذا كان مفقودًا
        run: |
          if [ ! -d "android" ]; then
            flutter create . \
              --platforms=android \
              --org com.yemenseloo \
              --project-name yemen_seloo \
              --no-pub
          fi

      - name: ترقية Kotlin و AGP و Gradle Wrapper و NDK
        run: |
          sed -i 's|id "org.jetbrains.kotlin.android" version "[^"]*"|id "org.jetbrains.kotlin.android" version "2.0.21"|g' android/settings.gradle
          sed -i 's|id "com.android.application" version "[^"]*"|id "com.android.application" version "8.3.0"|g' android/settings.gradle

          if [ -f android/build.gradle ]; then
            sed -i 's|ext.kotlin_version = .*|ext.kotlin_version = "2.0.21"|g' android/build.gradle
          fi

          sed -i 's|distributionUrl=.*gradle-[0-9.]*-all.zip|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's|distributionUrl=.*gradle-[0-9.]*-bin.zip|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties

          echo "=== إضافة ndkVersion ==="
          if grep -q 'ndkVersion' android/app/build.gradle; then
            sed -i 's|ndkVersion .*|ndkVersion = "25.1.8937393"|' android/app/build.gradle
          else
            sed -i '/android {/a\    ndkVersion = "25.1.8937393"' android/app/build.gradle
          fi
          grep -n "ndkVersion" android/app/build.gradle || true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yemen-seloo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: warn
