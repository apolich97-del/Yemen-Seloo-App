name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: نسخ google-services.json احتياطيًا
        run: |
          if [ -f "android/app/google-services.json" ]; then
            mkdir -p /tmp/seloo-backup
            cp android/app/google-services.json /tmp/seloo-backup/google-services.json
          fi

      - name: إعادة إنشاء android/ من الصفر
        run: |
          rm -rf android/
          flutter create . \
            --platforms=android \
            --org com.yemenseloo \
            --project-name yemen_seloo \
            --no-pub
          echo "=== ملفات android/ ==="
          ls -la android/
          ls -la android/app/
          echo ""
          echo "=== settings.gradle الأصلي ==="
          cat android/settings.gradle || cat android/settings.gradle.kts || echo "لا يوجد"

      - name: استعادة google-services.json
        run: |
          if [ -f "/tmp/seloo-backup/google-services.json" ]; then
            cp /tmp/seloo-backup/google-services.json android/app/google-services.json
          fi

      - name: تعديل settings.gradle (Groovy) — الإضافات
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path

          f = 'android/settings.gradle'
          p = Path(f)
          if not p.exists():
              print(f"⚠ {f} غير موجود")
              exit(0)

          content = p.read_text()
          print("=== settings.gradle (قبل) ===")
          print(content)

          # Kotlin
          content = re.sub(
              r'id\s+"org\.jetbrains\.kotlin\.android"\s+version\s+"[^"]*"',
              'id "org.jetbrains.kotlin.android" version "2.0.21"',
              content
          )
          # AGP
          content = re.sub(
              r'id\s+"com\.android\.application"\s+version\s+"[^"]*"',
              'id "com.android.application" version "8.3.0"',
              content
          )

          # google-services
          if 'com.google.gms.google-services' not in content:
              content = re.sub(
                  r'(id\s+"com\.android\.application"\s+version\s+"[^"]*")',
                  r'\1\n    id "com.google.gms.google-services" version "4.4.2" apply false',
                  content
              )

          p.write_text(content)
          print("=== settings.gradle (بعد) ===")
          print(content)
          PYEOF

      - name: تعديل settings.gradle.kts — إن وُجد
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path

          f = 'android/settings.gradle.kts'
          p = Path(f)
          if not p.exists():
              print(f"⚠ {f} غير موجود — لا شيء")
              exit(0)

          content = p.read_text()
          print("=== settings.gradle.kts (قبل) ===")
          print(content)

          content = re.sub(
              r'id\("org\.jetbrains\.kotlin\.android"\)\s+version\s+"[^"]*"',
              'id("org.jetbrains.kotlin.android") version "2.0.21"',
              content
          )
          content = re.sub(
              r'id\("com\.android\.application"\)\s+version\s+"[^"]*"',
              'id("com.android.application") version "8.3.0"',
              content
          )

          if 'com.google.gms.google-services' not in content:
              content = re.sub(
                  r'(id\("com\.android\.application"\)\s+version\s+"[^"]*")',
                  r'\1\n    id("com.google.gms.google-services") version "4.4.2" apply false',
                  content
              )

          p.write_text(content)
          print("=== settings.gradle.kts (بعد) ===")
          print(content)
          PYEOF

      - name: تعديل gradle wrapper
        run: |
          F=android/gradle/wrapper/gradle-wrapper.properties
          if [ -f "$F" ]; then
            sed -i 's|distributionUrl=.*gradle-[0-9.]*-all.zip|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-all.zip|g' "$F" || true
            sed -i 's|distributionUrl=.*gradle-[0-9.]*-bin.zip|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-all.zip|g' "$F" || true
            echo "=== gradle-wrapper.properties ==="
            cat "$F"
          fi

      - name: ضبط build.gradle (app) بـ Python
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path

          def process(path):
              p = Path(path)
              if not p.exists():
                  print(f"⚠ {path} غير موجود")
                  return
              print(f"\n=== معالجة {path} ===")
              lines = p.read_text().split('\n')
              out = []
              has_ndk = False
              has_gs = False
              for line in lines:
                  stripped = line.strip()
                  indent = line[:len(line) - len(line.lstrip())]

                  if stripped.startswith('ndkVersion'):
                      out.append(f'{indent}ndkVersion = "25.1.8937393"')
                      has_ndk = True
                      continue

                  if re.match(r'^minSdkVersion\b', stripped):
                      out.append(f'{indent}minSdkVersion 23')
                      continue

                  if re.match(r'^minSdk\s*=', stripped):
                      out.append(f'{indent}minSdk = 23')
                      continue

                  if 'com.google.gms.google-services' in stripped:
                      has_gs = True

                  out.append(line)

                  if re.search(r'^android\s*\{', stripped) and not has_ndk:
                      out.append(f'{indent}    ndkVersion = "25.1.8937393"')
                      has_ndk = True
                      continue

                  if re.match(r'^id\s*\(?["\']com\.android\.application["\']\)?', stripped) and not has_gs:
                      out.append(f'{indent}    id("com.google.gms.google-services")')
                      has_gs = True

              p.write_text('\n'.join(out))
              print(f"=== {path} — انتهى ===")
              print(p.read_text())

          process('android/app/build.gradle')
          process('android/app/build.gradle.kts')
          PYEOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yemen-seloo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: warn
