name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: توليد مجلد android/ إذا كان مفقودًا
        run: |
          if [ ! -d "android" ]; then
            flutter create . \
              --platforms=android \
              --org com.yemenseloo \
              --project-name yemen_seloo \
              --no-pub
          fi

      - name: ترقية Kotlin إلى 2.1.0
        run: |
          echo "=== قبل الترقية ==="
          cat android/settings.gradle || true

          sed -i 's|id "org.jetbrains.kotlin.android" version "[^"]*"|id "org.jetbrains.kotlin.android" version "2.1.0"|g' android/settings.gradle

          if [ -f android/build.gradle ]; then
            sed -i 's|ext.kotlin_version = .*|ext.kotlin_version = "2.1.0"|g' android/build.gradle
          fi

          echo "=== بعد الترقية ==="
          cat android/settings.gradle

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze (لا يُفشل البناء)
        run: flutter analyze || true

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yemen-seloo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: warn
