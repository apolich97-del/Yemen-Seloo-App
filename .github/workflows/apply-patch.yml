name: Apply patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract
        run: |
          curl -fsSL -o /tmp/p.zip https://base44.app/api/apps/6aefee2d117870b4236d26a4/files/mp/public/6aefee2d117870b4236d26a4/148a73632_seloo_fix.zip
          mkdir -p /tmp/p
          unzip -oq /tmp/p.zip -d /tmp/p
          cp -R /tmp/p/. .
      - name: Commit
        run: |
          git config user.name "seloo-bot"
          git config user.email "[seloo-bot@users.noreply.github.com](mailto:seloo-bot@users.noreply.github.com)"
          git add -A
          git commit -m "Apply checkout, payment, orders, admin and server-side pricing"
          git push
