name: Apply patch
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract
        run: |
          curl -fsSL -o /tmp/p.zip "https://base44.app/api/apps/6aefee2d117870b4236d26a4/files/mp/public/6aefee2d117870b4236d26a4/7e30f6ae0_seloo_fees12.zip"
          mkdir -p /tmp/p
          python3 -c "import zipfile;zipfile.ZipFile('/tmp/p.zip').extractall('/tmp/p')"
          cp -R /tmp/p/. .
      - name: Commit
        run: |
          git config user.name "seloo-bot"
          git config user.email "seloo-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "لا تغييرات — لا حاجة لالتزام"
          else
            git commit -m "Unify fees: 75 SAR free-shipping threshold, 15-20 day delivery"
            git push
          fi
      - name: Build APK بعد الدفع مباشرة
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 5
          gh workflow run build-apk.yml --ref main
          echo "تم تشغيل البناء تلقائياً"
