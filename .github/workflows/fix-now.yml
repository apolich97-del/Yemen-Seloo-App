name: Fix now
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > /tmp/f.py <<'EOF'
          import re
          from pathlib import Path
          p = Path('lib/features/profile/profile_screen.dart')
          s = p.read_text()
          if "import 'address_form_screen.dart';" not in s:
              s = s.replace("import '../../core/services/auth_service.dart';",
                            "import '../../core/services/auth_service.dart';\nimport 'address_form_screen.dart';", 1)
          if 'AddressFormScreen()' not in s:
              handler = ("onPressed: () async {\n"
                         "            final r = await Get.to(() => const AddressFormScreen());\n"
                         "            if (r != null) await controller.loadAddresses();\n"
                         "          },")
              s = s.replace('onPressed: controller.addAddress,', handler, 1)
          p.write_text(s)
          print('profile:', 'AddressFormScreen()' in s)
          o = Path('lib/core/services/order_service.dart')
          t = o.read_text()
          pat = [re.com](https://re.com)pile(r"return q\.orderBy\('createdAt', descending: true\)\.limit\(100\)\.snapshots\(\)\.map\([\s\S]*?\n\s*\);")
          new = ("return q.limit(100).snapshots().map((snap) {\n"
                 "      final list = snap.docs\n"
                 "          .map((d) => Order.fromDoc(d.id, d.data() as Map<String, dynamic>))\n"
                 "          .toList();\n"
                 "      list.sort((a, b) => [b.createdAt.com](https://b.createdAt.com)pareTo(a.createdAt));\n"
                 "      return list;\n"
                 "    });")
          t2, n = pat.subn(new, t, count=1)
          print('orders:', n)
          if n:
              o.write_text(t2)
          EOF
          python3 /tmp/f.py
          git config user.name seloo-bot
          git config user.email seloo-bot@localhost
          git add -A
          git commit -m "Fix address form and orders query" || echo none
          git push
