name: Apply today fixes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Firebase client id, addresses and orders
        run: |
          python3 << 'PYEOF'
          import re
          from pathlib import Path

          CLIENT_ID = '[580529134357-3ns98ki8rqvlnmkorf0k6j7i0g7vagt9.apps.googleusercontent.com](https://580529134357-3ns98ki8rqvlnmkorf0k6j7i0g7vagt9.apps.googleusercontent.com)'

          # 1) تعبئة default_web_client_id داخل values.xml في وركفلو البناء
          wf = Path('.github/workflows/build-apk.yml')
          w = wf.read_text()
          pat = [re.com](https://re.com)pile('<string name="default_web_client_id"[^>]*>[^<]*</string>')
          new = '<string name="default_web_client_id" translatable="false">' + CLIENT_ID + '</string>'
          w2, n = pat.subn(new, w, count=1)
          assert n == 1, 'لم أجد سطر default_web_client_id'
          wf.write_text(w2)

          # 2) شاشة الحساب: فتح نموذج العنوان مباشرة بدل المسار المسمّى
          p = Path('lib/features/profile/profile_screen.dart')
          s = p.read_text()
          if 'address_form_screen.dart' not in s:
              s = s.replace(
                  "import '../../core/services/auth_service.dart';",
                  "import '../../core/services/auth_service.dart';" + chr(10) + "import 'address_form_screen.dart';",
                  1)
          handler = (
              "onPressed: () async {" + chr(10) +
              "            await Get.to(() => const AddressFormScreen());" + chr(10) +
              "            await controller.loadAddresses();" + chr(10) +
              "          },")
          if 'AddressFormScreen()' not in s:
              s = s.replace('onPressed: controller.addAddress,', handler, 1)
          p.write_text(s)

          # 3) خدمة الطلبات: إزالة orderBy الذي يحتاج فهرساً مركّباً
          o = Path('lib/core/services/order_service.dart')
          t = o.read_text()
          if "orderBy('createdAt', descending: true).limit(100)" in t:
              pat2 = [re.com](https://re.com)pile(
                  r"return q\.orderBy\('createdAt', descending: true\)\.limit\(100\)\.snapshots\(\)\.map\(.*?\n\s*\);",
                  re.S)
              new2 = (
                  "return q.limit(100).snapshots().map((snap) {" + chr(10) +
                  "      final list = snap.docs" + chr(10) +
                  "          .map((d) => Order.fromDoc(d.id, d.data() as Map<String, dynamic>))" + chr(10) +
                  "          .toList();" + chr(10) +
                  "      list.sort((a, b) => b.createdAt" + chr(10) +
                  "          .compareTo(a.createdAt));" + chr(10) +
                  "      return list;" + chr(10) +
                  "    });")
              t, n2 = pat2.subn(new2, t, count=1)
              assert n2 == 1, 'لم أجد نمط myOrders'
              o.write_text(t)
          print('OK: patched build-apk.yml + profile_screen.dart + order_service.dart')
          PYEOF
          BOT_EMAIL=$(printf '%s@%s' seloo-bot [users.noreply.github.com](https://users.noreply.github.com))
          git config user.name seloo-bot
          git config user.email "$BOT_EMAIL"
          git add -A
          git diff --cached --stat
          git commit -m "Enable Google sign-in client id and fix addresses/orders" || echo "لا تغييرات جديدة"
          git push
