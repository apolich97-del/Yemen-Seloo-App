name: Apply today fixes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Firebase client id, addresses and orders
        run: |
          python3 << 'PYEOF'
          import json
          import re
          from pathlib import Path

          # 1) استخراج معرّف عميل الويب من ملف إعدادات فايربيس داخل المستودع
          gs = json.loads(Path('android/app/google-services.json').read_text())
          web_id = ''
          for c in gs.get('client', []):
              for oc in c.get('oauth_client', []):
                  if oc.get('client_type') == 3:
                      web_id = oc.get('client_id', '')
          assert web_id, 'لا يوجد Web client id في google-services.json'

          # 2) تعبئة default_web_client_id داخل values.xml في وركفلو البناء
          wf = Path('.github/workflows/build-apk.yml')
          w = wf.read_text()
          new = '<string name="default_web_client_id" translatable="false">' + web_id + '</string>'
          w2 = re.sub('<string name="default_web_client_id"[^>]*>[^<]*</string>', new, w, count=1)
          assert w2 != w, 'لم أجد سطر default_web_client_id'
          wf.write_text(w2)

          # 3) شاشة الحساب: فتح نموذج العنوان مباشرة بدل المسار المسمّى
          p = Path('lib/features/profile/profile_screen.dart')
          s = p.read_text()
          if 'address_form_screen.dart' not in s:
              s = s.replace(
                  "import '../../core/services/auth_service.dart';",
                  "import '../../core/services/auth_service.dart';" + chr(10) + "import 'address_form_screen.dart';",
                  1)
          handler = (
              "onPressed: () async {" + chr(10) +
              "            await Get.to(() => const AddressFormScreen());" + chr(10) +
              "            await controller.loadAddresses();" + chr(10) +
              "          },")
          if 'AddressFormScreen()' not in s:
              s = s.replace('onPressed: controller.addAddress,', handler, 1)
          p.write_text(s)

          # 4) خدمة الطلبات: إزالة orderBy الذي يحتاج فهرساً مركّباً
          o = Path('lib/core/services/order_service.dart')
          t = o.read_text()
          if "orderBy('createdAt', descending: true).limit(100)" in t:
              new2 = (
                  "return q.limit(100).snapshots().map((snap) {" + chr(10) +
                  "      final list = snap.docs" + chr(10) +
                  "          .map((d) => Order.fromDoc(d.id, d.data() as Map<String, dynamic>))" + chr(10) +
                  "          .toList();" + chr(10) +
                  "      list.sort((a, b) => b.createdAt" + chr(10) +
                  "          .compareTo(a.createdAt));" + chr(10) +
                  "      return list;" + chr(10) +
                  "    });")
              t2 = re.sub(
                  r"return q\.orderBy\('createdAt', descending: true\)\.limit\(100\)\.snapshots\(\)\.map\(.*?\n\s*\);",
                  new2, t, count=1, flags=re.S)
              assert t2 != t, 'لم أجد نمط myOrders'
              o.write_text(t2)

          print('OK: web client id =', web_id)
          PYEOF
          BOT_EMAIL=$(printf '%s@%s' seloo-bot localhost)
          git config user.name seloo-bot
          git config user.email "$BOT_EMAIL"
          git add -A
          git diff --cached --stat
          git commit -m "Enable Google sign-in client id and fix addresses/orders" || echo "لا تغييرات جديدة"
          git push
