name: Deploy Firestore Rules, Storage & Indexes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/deploy-firebase.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Write service account
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::سر FIREBASE_SERVICE_ACCOUNT غير مضاف"
            exit 1
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
      - name: Deploy Firestore Rules & Indexes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npm install -g firebase-tools@13
          firebase deploy --only firestore --project yemen-seloo-app --non-interactive
          firebase deploy --only storage --project yemen-seloo-app --non-interactive || echo "::warning::Storage rules deploy skipped (ensure Firebase Storage is initialized in console)"
