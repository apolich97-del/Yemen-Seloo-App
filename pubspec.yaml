name: yemen_seloo
description: تطبيق Yemen Seloo — تسوّق من SHEIN وإضافة المنتجات إلى سلة سيلو.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  get: ^4.6.6

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  firebase_crashlytics: ^4.1.3
  firebase_messaging: ^15.1.3

  flutter_inappwebview: ^6.1.5

  get_storage: ^2.1.1
  path_provider: ^2.1.4

  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  url_launcher: ^6.3.1
  share_plus: ^10.0.2
  location: ^7.0.0
  intl: ^0.19.0
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/js/
    - assets/images/

# ⭐ إعدادات أيقونة التطبيق — تُولَّد من logo.png
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#7C3AED"
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 23
  remove_alpha_ios: true
