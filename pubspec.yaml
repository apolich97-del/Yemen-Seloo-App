name: yemen_seloo
description: تطبيق Yemen Seloo — تسوّق من SHEIN وإضافة المنتجات إلى سلة سيلو.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # الحالة والتنقّل
  get: ^4.6.6

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3
  firebase_messaging: ^15.1.3

  # الـWebView والجسر المحقون
  flutter_inappwebview: ^6.1.5

  # التخزين المحلي
  get_storage: ^2.1.1
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4

  # الواجهة
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  shimmer: ^3.0.0

  # خدمات مساندة
  url_launcher: ^6.3.1
  share_plus: ^10.0.2
  google_maps_flutter: ^2.9.0
  fix: حذف google_places_autocomplete غير الموجود على pub.dev
  location: ^7.0.0
  flutter_local_notifications: ^17.2.3
  intl: ^0.19.0
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/js/
    - assets/images/
    - assets/lottie/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal/Tajawal-Bold.ttf
          weight: 700
